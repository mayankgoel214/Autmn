# The two processes are scraped separately because they fail separately: the API
# can be healthy while the worker is wedged, and a single merged target would
# hide exactly that.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: autmn-api
    static_configs:
      - targets: ['api:9100']
        labels:
          service: api

  - job_name: autmn-worker
    static_configs:
      - targets: ['worker:9101']
        labels:
          service: worker

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
