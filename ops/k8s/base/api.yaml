apiVersion: apps/v1
kind: Deployment
metadata:
  name: autmn-api
  namespace: autmn
  labels: { app: autmn-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: autmn-api }
  template:
    metadata:
      labels: { app: autmn-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: api
          # Overridden per environment by the `images:` block in
          # kustomization.yaml. IfNotPresent rather than the default: a :latest
          # tag makes Kubernetes default to Always, which fails against an image
          # side-loaded into a local cluster and pulls needlessly in production.
          image: autmn-api:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/api/dist/index.js"]
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9100 }
          envFrom:
            - configMapRef: { name: autmn-config }
            - secretRef: { name: autmn-secrets }
          env:
            - { name: METRICS_PORT, value: "9100" }
          # Liveness restarts a wedged process; readiness only removes it from
          # the Service. They point at the same endpoint but mean different
          # things, so the liveness probe is far more forgiving — restarting a
          # pod that is merely slow makes an overload worse.
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: autmn-api
  namespace: autmn
  labels: { app: autmn-api }
spec:
  selector: { app: autmn-api }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9100, targetPort: metrics }
---
# Webhook delivery is the thing that must not drop during a rollout: Meta
# retries, but a gap still shows up as delayed messages to customers.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: autmn-api
  namespace: autmn
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: autmn-api }
