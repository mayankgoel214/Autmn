<!doctype html>
<!--
  Before/after card for the demo recording. Reads the latest transcript for the
  generated image URL; the input photo is the seeded demo file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marquee — result</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #0b141a;
        color: #e9edef;
        font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
      }
      h2 {
        font-size: 26px;
      }
      .pair {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      figure {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }
      img {
        height: 52vh;
        border-radius: 12px;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      }
      figcaption {
        color: #8696a0;
        font-size: 15px;
      }
      .meta {
        color: #667781;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h2>The customer's photo → the delivered ad</h2>
    <div class="pair">
      <figure>
        <img src="http://localhost:3000/files/raw-images/demo/input.jpg" />
        <figcaption>sent on WhatsApp</figcaption>
      </figure>
      <figure>
        <img id="out" />
        <figcaption id="cap">generated by the pipeline</figcaption>
      </figure>
    </div>
    <p class="meta" id="meta"></p>
    <script>
      fetch('results/demo-transcript.json')
        .then((r) => r.json())
        .then((d) => {
          const last = d.transcript[d.transcript.length - 1];
          document.getElementById('out').src = last.imageUrl;
          document.getElementById('meta').textContent =
            `order ${d.orderId} — Gemini 3 Pro Image, tier 1, deterministic QA passed` +
            (d.costInr ? ` — measured cost ₹${d.costInr}` : '');
        });
    </script>
  </body>
</html>
